# Home Assistant's water_heater as a heating-only Thermostat, as
# home-assistant-matter-hub serves it: the state is the operation mode
# ("off" is SystemMode Off, every other mode Heat); current_temperature and
# temperature are keys of the state. SystemMode writes go to the named
# method operation_mode ("off" or "on"), setpoints to temperature.
platform: water_heater
cites:
  - go-ha-catalog data/mqtt.json:6680-6900 (water_heater schema; min_temp, max_temp at 6770-6789)
  - go-ha-catalog data/features.json:124-129 (water_heater feature flags)
rows:
  - id: thermostat
    when: {}
    type: Thermostat
    verdict: mappable
    caveats:
      - when: {}
        reason: "operation modes other than off are all SystemMode Heat; the WaterHeater device type (modes, boost) is not mapped yet"
    cites:
      - matter.js packages/model/src/standard/elements/thermostat-device.element.ts:25 @862ad75f (Thermostat mandatory)
      - matter.js packages/model/src/standard/elements/temperature.element.ts:12 @862ad75f (the temperature datatype, int16 in 0.01 degC)
      - home-assistant/core homeassistant/components/water_heater/__init__.py:146-151,164-182,187-219 @2026.10.3 (the state is the operation mode; min_temp, max_temp; current_temperature, temperature)
      - home-assistant/core homeassistant/components/water_heater/const.py:53-58 @2026.10.3 (the operation states eco, electric, performance, high_demand, heat_pump, gas)
      - home-assistant/core homeassistant/const.py:299-300 @2026.10.3 (on, off)
      - home-assistant/core homeassistant/components/water_heater/services.py:78-100 @2026.10.3 (turn_on, turn_off, set_temperature, set_operation_mode)
      - home-assistant-matter-hub packages/backend/src/matter/endpoints/legacy/water-heater/index.ts:14-20,34-45 @664575a (a heating-only Thermostat with the entity's limits)
      - home-assistant-matter-hub packages/backend/src/matter/endpoints/legacy/water-heater/behaviors/water-heater-thermostat-server.ts:46-81 @664575a (off is Off, else Heat; off to set_operation_mode, else turn_on; the setpoint to set_temperature)
    clusters:
      - cluster: Thermostat
        features: [Heating]
        initial:
          - {attribute: ControlSequenceOfOperation, const: ControlSequenceOfOperationHeatingOnly}
          - {attribute: AbsMinHeatSetpointLimit, from: extra.min_temp, default_unit: "°C", units: &centi {"°C": {scale: 100}, "°F": {offset: -32, scale: 55.55555555555556}}}
          - {attribute: MinHeatSetpointLimit, from: extra.min_temp, default_unit: "°C", units: *centi}
          - {attribute: AbsMaxHeatSetpointLimit, from: extra.max_temp, default_unit: "°C", units: *centi}
          - {attribute: MaxHeatSetpointLimit, from: extra.max_temp, default_unit: "°C", units: *centi}
        attributes:
          - {attribute: LocalTemperature, from: state.current_temperature, default_unit: "°C", units: *centi}
          - {attribute: OccupiedHeatingSetpoint, from: state.temperature, default_unit: "°C", units: *centi}
          - {attribute: SystemMode, from: state, enum: {"off": SystemModeOff, "on": SystemModeHeat, eco: SystemModeHeat, electric: SystemModeHeat, performance: SystemModeHeat, high_demand: SystemModeHeat, heat_pump: SystemModeHeat, gas: SystemModeHeat}}
        commands:
          - write: [SystemMode]
            if: {field: SystemMode, in: [SystemModeOff, SystemModeHeat]}
            method: operation_mode
            raw: {field: SystemMode, enum: {SystemModeOff: "off", SystemModeHeat: "on"}}
          - write: [OccupiedHeatingSetpoint]
            method: temperature
            raw: &setpoint {field: OccupiedHeatingSetpoint, digits: 1, default_unit: "°C", units: {"°C": {scale: 0.01}, "°F": {scale: 0.018, add: 32}}}
          - change: [OccupiedHeatingSetpoint]
            method: temperature
            raw: *setpoint
