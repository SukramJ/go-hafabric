# Home Assistant's valve: open, closed, opening or closing. Open and
# Close go to the entity's named methods open_valve and close_valve.
platform: valve
cites:
  - go-ha-catalog data/mqtt.json:6480-6679 (valve schema)
  - go-ha-catalog data/features.json:118-123 (valve feature flags)
rows:
  - id: water_valve
    when: {}
    type: WaterValve
    verdict: mappable
    caveats:
      - when: {features: {any: [SET_POSITION]}}
        reason: "the valve's position is not mapped: go-fabric's valve server serves no Level feature"
    cites:
      - matter.js packages/model/src/standard/elements/water-valve.element.ts:19 @862ad75f (ValveConfigurationAndControl mandatory)
      - go-fabric cluster/spec/valveconfigurationandcontrol/definition_gen.go:30-46,117-119 @v0.15.4 (OpenDuration, RemainingDuration, CurrentState, TargetState; Open, Close; ValveStateEnum)
      - go-fabric device/defaults_declared.go:137-149 @v0.15.4 (the kit's valve server needs a StateSource and serves no feature; without it the generated server)
      - home-assistant/core homeassistant/components/valve/const.py:36-51 @2026.10.3 (OPEN, CLOSE, SET_POSITION; the states)
      - home-assistant/core homeassistant/components/valve/services.py:22-31 @2026.10.3 (open_valve, close_valve)
      - home-assistant-matter-hub packages/backend/src/matter/endpoints/legacy/valve/index.ts:11-31 @664575a (WaterValve; opening and closing are Transitioning)
    clusters:
      - cluster: ValveConfigurationAndControl
        start_null: [OpenDuration, RemainingDuration, CurrentState, TargetState]
        attributes:
          - {attribute: CurrentState, from: state, enum: {open: ValveStateOpen, closed: ValveStateClosed, opening: ValveStateTransitioning, closing: ValveStateTransitioning}}
          - {attribute: TargetState, from: state, enum: {open: ValveStateOpen, closed: ValveStateClosed, opening: ValveStateOpen, closing: ValveStateClosed}}
        commands:
          - handle: Open
            method: open_valve
            raw: {const: OPEN}
          - handle: Close
            method: close_valve
            raw: {const: CLOSE}
