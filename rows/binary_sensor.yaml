# Home Assistant's binary_sensor, by device class. A binary state reads
# "on" or "off" (a bool, "ON"/"OFF" or "true"/"false"). A test fails when
# a device class of the catalog has no row.
platform: binary_sensor
cites:
  - go-ha-catalog data/mqtt.json:780-934 (binary_sensor schema; payload_on/payload_off at 898-907)
  - go-ha-catalog data/device_classes.json:2-32 (binary_sensor device classes)
rows:
  - id: contact
    when: {device_class: [door, window, opening, garage_door]}
    type: ContactSensor
    verdict: mappable
    cites:
      - matter.js packages/model/src/standard/elements/contact-sensor.element.ts:19 @862ad75f (BooleanState mandatory)
      - matter.js packages/model/src/standard/resources/boolean-state.resource.ts:26-30 @862ad75f (Contact Sensor - FALSE=open or no contact, TRUE=closed or contact)
    clusters:
      - cluster: BooleanState
        attributes:
          # Home Assistant's on is open: StateValue false.
          - {attribute: StateValue, from: state, enum: {"on": false, "off": true}}
  - id: motion
    when: {device_class: [motion]}
    type: OccupancySensor
    verdict: mappable
    cites: &occupancy_cites
      - matter.js packages/model/src/standard/elements/occupancy-sensor.element.ts:20 @862ad75f (OccupancySensing mandatory)
      - matter.js packages/model/src/standard/resources/occupancy-sensing.resource.ts:45 @862ad75f (Occupancy, bit Occupied)
      - matter.js packages/node/src/behaviors/occupancy-sensing/OccupancySensingServer.ts:27-66 @862ad75f (OccupancySensorType and its bitmap follow the PIR, ultrasonic and physical-contact features)
    clusters:
      - cluster: OccupancySensing
        # Home Assistant's motion class is a motion detector: passive infrared.
        features: [PassiveInfrared]
        initial:
          - {attribute: OccupancySensorType, const: OccupancySensorTypeEnumPir}
          - {attribute: OccupancySensorTypeBitmap, const: OccupancySensorTypeBitmapPir}
        attributes: &occupied
          - {attribute: Occupancy, from: state, enum: {"on": OccupancyOccupied, "off": 0}}
  - id: occupancy
    when: {device_class: [occupancy, presence]}
    type: OccupancySensor
    verdict: mappable
    cites: *occupancy_cites
    clusters:
      - cluster: OccupancySensing
        # Home Assistant does not say how the sensor senses: Other, whose
        # sensor type matter.js leaves unset; the deprecated mandatory
        # OccupancySensorType takes its first value and the bitmap none.
        features: [Other]
        initial:
          - {attribute: OccupancySensorType, const: OccupancySensorTypeEnumPir}
          - {attribute: OccupancySensorTypeBitmap, const: 0}
        attributes: *occupied
  - id: water_leak
    when: {device_class: [moisture]}
    type: WaterLeakDetector
    verdict: mappable
    cites:
      - matter.js packages/model/src/standard/elements/water-leak-detector.element.ts:20-22 @862ad75f (BooleanState mandatory, CHGEVENT)
    clusters:
      - cluster: BooleanState
        attributes:
          - {attribute: StateValue, from: state, enum: {"on": true, "off": false}}
  - id: water_freeze
    when: {device_class: [cold]}
    type: WaterFreezeDetector
    verdict: mappable
    cites:
      - matter.js packages/model/src/standard/elements/water-freeze-detector.element.ts:19-23 @862ad75f (BooleanState mandatory, CHGEVENT)
      - home-assistant/core homeassistant/components/binary_sensor/const.py:23-24 @2026.10.3 (cold, on means cold)
    clusters:
      - cluster: BooleanState
        attributes:
          - {attribute: StateValue, from: state, enum: {"on": true, "off": false}}
  - id: smoke
    when: {device_class: [smoke]}
    type: SmokeCoAlarm
    verdict: mappable
    cites:
      - matter.js packages/model/src/standard/elements/smoke-co-alarm-device.element.ts:24,28 @862ad75f (SmokeCoAlarm mandatory, PowerSource device min 1)
      - matter.js packages/model/src/standard/resources/smoke-co-alarm-cluster.resource.ts:42 @862ad75f (SmokeState)
    parts: &alarm_power
      # SmokeCoAlarm requires a PowerSource device (min 1); Home Assistant
      # says nothing of the alarm's supply: a battery of unknown charge.
      - type: PowerSource
        clusters:
          - cluster: PowerSource
            features: [Battery]
            initial:
              - {attribute: Order, const: 0}
              - {attribute: BatReplacementNeeded, const: false}
            start_null: [BatPercentRemaining]
    clusters:
      - cluster: SmokeCoAlarm
        features: [SmokeAlarm]
        initial:
          - {attribute: ExpressedState, const: ExpressedStateNormal}
          - {attribute: SmokeState, const: AlarmStateNormal}
          - {attribute: BatteryAlert, const: AlarmStateNormal}
          - {attribute: TestInProgress, const: false}
          - {attribute: HardwareFaultAlert, const: false}
          - {attribute: EndOfServiceAlert, const: EndOfServiceNormal}
        attributes:
          - {attribute: SmokeState, from: state, enum: {"on": AlarmStateCritical, "off": AlarmStateNormal}}
          - {attribute: ExpressedState, from: state, enum: {"on": ExpressedStateSmokeAlarm, "off": ExpressedStateNormal}}
  - id: carbon_monoxide
    when: {device_class: [carbon_monoxide]}
    type: SmokeCoAlarm
    verdict: mappable
    cites:
      - matter.js packages/model/src/standard/elements/smoke-co-alarm-device.element.ts:24,28 @862ad75f (SmokeCoAlarm mandatory, PowerSource device min 1)
    parts: *alarm_power
    clusters:
      - cluster: SmokeCoAlarm
        features: [CoAlarm]
        initial:
          - {attribute: ExpressedState, const: ExpressedStateNormal}
          - {attribute: CoState, const: AlarmStateNormal}
          - {attribute: BatteryAlert, const: AlarmStateNormal}
          - {attribute: TestInProgress, const: false}
          - {attribute: HardwareFaultAlert, const: false}
          - {attribute: EndOfServiceAlert, const: EndOfServiceNormal}
        attributes:
          - {attribute: CoState, from: state, enum: {"on": AlarmStateCritical, "off": AlarmStateNormal}}
          - {attribute: ExpressedState, from: state, enum: {"on": ExpressedStateCoAlarm, "off": ExpressedStateNormal}}
  - id: generic
    when: {device_class: [none]}
    # Not OnOffSensor: its OnOff is a client cluster, so a controller would
    # never see the state (docs/by_design.md).
    type: ContactSensor
    verdict: mappable
    cites:
      - matter.js packages/model/src/standard/elements/contact-sensor.element.ts:19 @862ad75f (BooleanState mandatory)
      - matter.js packages/model/src/standard/resources/boolean-state.resource.ts:26-30 @862ad75f (Contact Sensor - FALSE=open or no contact, TRUE=closed or contact)
      - matter.js packages/model/src/standard/elements/on-off-sensor.element.ts:25 @862ad75f (OnOffSensor's OnOff is a client cluster)
    clusters:
      - cluster: BooleanState
        attributes:
          # As opening: Home Assistant's on is StateValue false.
          - {attribute: StateValue, from: state, enum: {"on": false, "off": true}}
  - id: no_device_type
    when: {device_class: [battery, battery_charging, connectivity, gas, glass_break, heat, light, lock, moving, plug, power, problem, running, safety, sound, tamper, update, vibration]}
    verdict: "unmappable: no Matter device type for a binary_sensor of device_class {device_class}"
